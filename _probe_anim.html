<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="assets/css/page-transition.css">
<style>body{margin:0;padding:40px;background:#eee}</style>
</head>
<body>
<div class="page-content" id="pc">
  <div class="card" id="cd" style="height:80px;background:#fff;margin-bottom:20px"></div>
  <div class="card" id="cd2" style="height:80px;background:#fff"></div>
</div>
<pre id="out">pending</pre>
<script>
const lines = [];
function sample(label) {
  const pc = getComputedStyle(document.getElementById('pc'));
  const cd = getComputedStyle(document.getElementById('cd'));
  const cd2 = getComputedStyle(document.getElementById('cd2'));
  lines.push(label);
  lines.push('  .page-content op=' + pc.opacity + ' tf=' + pc.transform + ' anim=' + pc.animationName + ' fill=' + pc.animationFillMode);
  lines.push('  .card       op=' + cd.opacity + ' tf=' + cd.transform + ' anim=' + cd.animationName);
  lines.push('  .card #2    op=' + cd2.opacity + ' tf=' + cd2.transform + ' anim=' + cd2.animationName);
}
// freeze at specific times
const anims = document.getElementById('pc').getAnimations();
anims.forEach(a => { a.pause(); a.currentTime = 0; });
sample('t=0ms (frozen at start)');
anims.forEach(a => { a.currentTime = 175; });
sample('t=175ms (frozen mid)');
anims.forEach(a => { a.currentTime = 350; });
sample('t=350ms (frozen at end)');
anims.forEach(a => { a.currentTime = 5000; a.finish(); });
sample('after finish()');
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
</html>
