<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<div id="out">pending</div>
<script>
const params = new URLSearchParams(location.search);
const page = params.get('p') || 'index.php';
if (params.get('sid')) document.cookie = 'PHPSESSID=' + params.get('sid') + '; path=/';
const frame = document.createElement('iframe');
frame.style.width = '1280px';
frame.style.height = '900px';
frame.src = page;
document.body.appendChild(frame);
const errs = [];
window.addEventListener('error', e => errs.push('harness:' + e.message));
frame.onload = () => {
  const w = frame.contentWindow;
  w.addEventListener('error', e => errs.push('page:' + e.message));
  setTimeout(() => {    const d = w.document;
    const sels = ['.page-content', '.main-content', '.container-fluid', '.login-container', '.register-container', '.booking-card', '.print-container', '.card'];
    const lines = [];
    lines.push('TITLE=' + d.title);
    lines.push('BODY_TF=' + w.getComputedStyle(d.body).transform);
    for (const s of sels) {
      const el = d.querySelector(s);
      if (!el) continue;
      const cs = w.getComputedStyle(el);
      if (cs.animationName && cs.animationName !== 'none') {
        const anims = el.getAnimations ? el.getAnimations() : [];
        let st = 'n/a';
        try { const a = anims[0]; if (a) st = a.playState + ' t=' + Math.round(a.currentTime) + ' fill=' + a.effect.getTiming().fill; } catch(e) { st = 'err'; }
        lines.push('ANIM ' + s + ' => ' + cs.animationName + ' ' + cs.animationDuration + ' op=' + cs.opacity + ' tf=' + cs.transform + ' [' + st + ']');
      }
    }
    // check fixed elements and their containing block
    const fixed = d.querySelectorAll('body *');
    const animSel = ['.page-content', '.main-content', '.container-fluid', '.login-container', '.register-container', '.booking-card', '.print-container'];
    for (const el of fixed) {
      const cs = w.getComputedStyle(el);
      if (cs.position === 'fixed') {
        let anc = el.parentElement, inAnim = null;
        while (anc && anc !== d.body) {
          if (animSel.includes(anc.tagName.toLowerCase() + '.' + anc.className.split(' ')[0]) || animSel.some(s => anc.matches(s))) { inAnim = anc.tagName + '.' + anc.className; break; }
          anc = anc.parentElement;
        }
        lines.push('FIXED ' + el.tagName + '.' + (el.className || '') + ' insideAnimated=' + (inAnim || 'NO') + ' display=' + cs.display + ' vis=' + cs.visibility + ' rect=' + JSON.stringify(el.getBoundingClientRect().toJSON()));
      }
    }
    lines.push('SCROLLW=' + d.documentElement.scrollWidth + ' VW=' + w.innerWidth);
    lines.push('ERRS=' + (errs.length ? errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = lines.join('\n');
  }, 1200);
};
</script>
</body>
</html>
