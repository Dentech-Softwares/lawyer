<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@keyframes fwd { 0% { opacity:0; transform: translateY(15px);} 100% { opacity:1; transform:none;} }
@keyframes bwd { 0% { opacity:0; transform: translateY(15px);} 100% { opacity:1; transform:none;} }
#a { animation: fwd 0.3s ease-out forwards; }
#b { animation: bwd 0.3s ease-out backwards; }
.wrap { position: relative; }
.fx { position: fixed; top: 0; left: 0; width: 50px; height: 50px; background: red; }
</style></head>
<body>
<div class="wrap" id="a"><div class="fx" id="fa"></div></div>
<div class="wrap" id="b"><div class="fx" id="fb"></div></div>
<pre id="out"></pre>
<script>
setTimeout(() => {
  const out = [];
  for (const id of ['a','b']) {
    const w = document.getElementById(id);
    const cs = getComputedStyle(w);
    const f = document.getElementById(id === 'a' ? 'fa' : 'fb');
    out.push(id + ': transform=' + cs.transform + ' opacity=' + cs.opacity);
    out.push('  fixed child rect=' + JSON.stringify(f.getBoundingClientRect().toJSON()));
  }
  document.getElementById('out').textContent = out.join('\n');
}, 1500);
</script>
</body></html>
