<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe timing</title></head>
<body>
<div id="out">pending</div>
<script>
const params = new URLSearchParams(location.search);
const page = params.get('p') || 'index.php';
if (params.get('sid')) document.cookie = 'PHPSESSID=' + params.get('sid') + '; path=/';
const frame = document.createElement('iframe');
frame.style.width = '1280px';
frame.style.height = '900px';
frame.src = page;
document.body.appendChild(frame);
const lines = [];
frame.onload = () => {
  const w = frame.contentWindow, d = w.document;
  const sels = ['.page-content', '.main-content', '.login-container', '.register-container', '.booking-card', '.print-container'];
  const t0 = performance.now();
  const samples = [];
  const tick = () => {
    const el = d.querySelector('.page-content, .main-content, .login-container, .register-container, .booking-card, .print-container');
    if (el) {
      const cs = w.getComputedStyle(el);
      samples.push(Math.round(performance.now() - t0) + 'ms op=' + (Math.round(parseFloat(cs.opacity)*100)/100) + ' tf=' + cs.transform);
    }
    if (performance.now() - t0 < 900) setTimeout(tick, 60);
    else {
      lines.push('SAMPLES for ' + page);
      samples.forEach(s => lines.push('  ' + s));
      document.getElementById('out').textContent = lines.join('\n');
    }
  };
  setTimeout(tick, 10);
};
</script>
</body>
</html>
