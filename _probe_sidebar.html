<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe sidebar</title></head>
<body>
<div id="out">pending</div>
<script>
const params = new URLSearchParams(location.search);
const page = params.get('p') || 'client_dashboard.php';
if (params.get('sid')) document.cookie = 'PHPSESSID=' + params.get('sid') + '; path=/';
const frame = document.createElement('iframe');
frame.style.width = '1280px';
frame.style.height = '900px';
frame.src = page;
document.body.appendChild(frame);
frame.onload = () => {
  const w = frame.contentWindow, d = w.document;
  const links = d.querySelectorAll('.sidebar-nav a, .sidebar-menu a');
  const lines = ['PAGE=' + page];
  links.forEach(a => {
    lines.push('  ' + a.getAttribute('href') + ' active=' + a.classList.contains('active') + ' fontSize=' + w.getComputedStyle(a).fontSize + ' lineHeight=' + w.getComputedStyle(a).lineHeight);
  });
  const aside = d.querySelector('aside.sidebar');
  lines.push('  sidebar present=' + !!aside + ' brand=' + (aside ? (aside.querySelector('.sidebar-brand h2') || {}).textContent : '').trim());
  document.getElementById('out').textContent = lines.join('\n');
};
</script>
</body>
</html>
